name: Live data (daily)

# Optional live mode. Runs only when the repository variable LIVE_MODE is "true"
# (Settings -> Secrets and variables -> Actions -> Variables).
on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC, when yesterday is complete in Lisbon
  workflow_dispatch:

permissions:
  contents: write          # to commit the new days; nothing else

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  collect:
    if: vars.LIVE_MODE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect new complete days (first run backfills from 2019)
        run: python live.py collect | tee collect.log
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/pt_daily_demand.csv
          if git diff --cached --quiet; then
            echo "No new days." >> "$GITHUB_STEP_SUMMARY"
          else
            last=$(tail -n 1 data/live/pt_daily_demand.csv | cut -d, -f1)
            git commit -m "Live data: Portugal demand up to $last"
            git push
            echo "Live data saved up to $last." >> "$GITHUB_STEP_SUMMARY"
          fi
          grep "Skipped" collect.log >> "$GITHUB_STEP_SUMMARY" || true
